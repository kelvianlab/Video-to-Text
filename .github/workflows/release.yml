name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v. Must match video_to_text/__init__.py (e.g. 1.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  # From the form when started by hand, from the tag (v1.1.0 -> 1.1.0) when a tag is pushed.
  RAW_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: The version asked for is the version in the code
        shell: pwsh
        run: |
          $wanted = "$env:RAW_VERSION".TrimStart("v")
          "VERSION=$wanted" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $code = python -c "import video_to_text; print(video_to_text.__version__)"
          if ($code -ne $wanted) { throw "asked for $wanted but the code says $code" }

      - name: Install the exact library versions
        run: pip install -r requirements-build.txt

      - uses: actions/cache@v4
        with:
          path: model
          key: models-small-ocr-v1

      - name: Fetch the models the app bundles
        run: python packaging/fetch_models.py small

      - name: Run the test suite first
        run: python -m pytest -q

      - name: Build the app folder
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/video-to-text.spec

      - name: Check the built app hears speech, reads the screen, and opens its window
        shell: pwsh
        run: ./packaging/smoke_test.ps1 -AppFolder "dist/Video to Text"

      - name: Gather licences and zip
        run: python packaging/make_zip.py

      - uses: actions/cache@v4
        with:
          path: cuda
          key: cuda-cublas-12.9.2.10-v1

      - name: Fetch NVIDIA's CUDA libraries for the NVIDIA edition
        run: python packaging/fetch_cuda.py

      - name: Zip the NVIDIA edition
        run: python packaging/make_zip.py --nvidia

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Video to Text ${{ env.VERSION }}
          files: |
            dist/Video-to-Text-${{ env.VERSION }}-Windows.zip
            dist/Video-to-Text-${{ env.VERSION }}-Windows-NVIDIA.zip
          body: |
            ## Download

            Pick **one** of the two zips. Both are the same app.

            | File | For | Size |
            |---|---|---|
            | `Video-to-Text-${{ env.VERSION }}-Windows.zip` | any Windows computer; uses the processor | about 600 MB |
            | `Video-to-Text-${{ env.VERSION }}-Windows-NVIDIA.zip` | computers with an NVIDIA graphics card; reads speech about 5 times faster | about 1.1 GB |

            The NVIDIA edition carries NVIDIA's CUDA libraries inside it, so nothing else has
            to be installed. On a computer where the card cannot be used, it simply uses the
            processor, like the ordinary edition.

            1. Download the zip (large, because everything the app needs is inside it).
            2. Right-click it and choose **Extract All**.
            3. Open the `Video to Text` folder and double-click **`Video to Text.exe`**.

            Nothing to install: no Python, no ffmpeg, no internet needed. Your video is never
            uploaded and never changed.

            The first time, Windows may say **"Windows protected your PC"**. That is because the
            app is not code-signed, not because anything is wrong with it. Click **More info**,
            then **Run anyway**. Windows asks only once.

            Reads the speech, in **English or Indonesian**, and the on-screen text of any video
            file, whether or not it ever had subtitles.

            ---

            `Source code (zip)` and `(tar.gz)` are added by GitHub automatically. They are not
            the app; you do not need them.

            Built and checked by GitHub Actions from this exact commit: the test suite ran, then
            the finished app was run on a test video and had to hear its spoken words and read
            its on-screen caption before this release was published.
